<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login – BOT PAPA Intranet</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #050816; --bg-card: #0d1428; --bg-input: #0a1230;
      --accent: #00e0ff; --accent-soft: rgba(0,224,255,0.08);
      --accent2: #7b3fff;
      --text: #f5f7ff; --muted: #a3aac2; --danger: #ff4757;
      --border: rgba(255,255,255,0.07); --border-accent: rgba(0,224,255,0.2);
      --radius: 14px; --radius-full: 999px;
      --font: system-ui, -apple-system, "Segoe UI", sans-serif;
      --shadow: 0 18px 45px rgba(0,0,0,0.55);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top, #101735 0, #050816 55%, #02030a 100%);
      color: var(--text); font-family: var(--font);
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 20px;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { width: 100%; max-width: 400px; }

    /* Logo */
    .logo-block { text-align: center; margin-bottom: 32px; }
    .logo-circle {
      width: 80px; height: 80px; border-radius: 50%;
      background: #fff; margin: 0 auto 14px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; box-shadow: 0 0 0 4px var(--accent-soft);
    }
    .logo-circle img { width: 100%; height: 100%; object-fit: contain; }
    .logo-title {
      font-size: 18px; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    .logo-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* Card */
    .card {
      background: linear-gradient(155deg, rgba(8,13,34,0.97), rgba(2,4,13,0.98));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 24px;
      box-shadow: var(--shadow);
    }
    .card-title {
      font-size: 15px; font-weight: 600;
      margin-bottom: 20px; color: var(--text);
    }
    .card-title span { color: var(--accent); }

    /* Form */
    .field { margin-bottom: 20px; }
    label { display: block; font-size: 11px; color: var(--muted);
            text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
    input {
      width: 100%; padding: 12px;
      background: var(--bg-input); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px;
      font-family: var(--font); font-size: 14px;
      outline: none; transition: border-color .2s;
    }
    input:focus { border-color: var(--accent); }
    input::placeholder { color: rgba(163,170,194,.5); }

    /* Button */
    .btn {
      width: 100%; padding: 12px;
      background: linear-gradient(135deg, #00e0ff, #7b3fff);
      color: #050816; border: none; border-radius: var(--radius-full);
      font-size: 13px; font-weight: 700; letter-spacing: 0.04em;
      text-transform: uppercase; cursor: pointer;
      transition: filter .2s, transform .2s;
    }
    .btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    /* Status */
    .status { margin-top: 18px; font-size: 13px; min-height: 18px; text-align: center; line-height: 1.4; }
    .status.err { color: var(--danger); }
    .status.ok  { color: #00c896; }

    /* Footer */
    .page-footer {
      margin-top: 28px; font-size: 11px; color: var(--muted); text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="logo-block">
      <div class="logo-circle">
        <img src="../pics/BOT_PAPA-removebg.png" alt="BOT PAPA" />
      </div>
      <div class="logo-title">BOT PAPA</div>
      <div class="logo-sub">Intranet · Partner Network</div>
    </div>

    <div class="card">
      <div class="card-title">Sign In <span>·</span> Franchisees & Partners</div>

      <div class="field">
        <label for="email">Your Email Address</label>
        <input id="email" type="email" placeholder="partner@bot-papa.online" autocomplete="email" required />
      </div>

      <button class="btn" id="loginBtn" onclick="sendMagicLink()">Request Login Link</button>
      <div class="status" id="status"></div>
    </div>

    <div class="page-footer">© 2026 BOT PAPA - made with love ❤️ in Davao City, Philippines · Internal Use Only</div>
  </div>

  <script>
    const { createClient } = supabase;
    const sb = createClient(
      'https://jvujmlssgnqawqqaeqnb.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2dWptbHNzZ25xYXdxcWFlcW5iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MzQwMzcsImV4cCI6MjA5NTUxMDAzN30.H604HEyX8ezyP41JMxT6JcZ1J4wlNBmo_u2LIT5KPiI'
    );

    const statusEl = document.getElementById('status');
    const loginBtn = document.getElementById('loginBtn');

    function setStatus(msg, type = '') {
      statusEl.innerHTML = msg;
      statusEl.className = 'status ' + type;
    }

    async function sendMagicLink() {
      const email = document.getElementById('email').value.trim();

      if (!email) {
        setStatus('Please enter your email address.', 'err');
        return;
      }

      loginBtn.disabled = true;
      setStatus('Generating link…');

      try {
        const { error } = await sb.auth.signInWithOtp({
          email: email,
          options: {
            shouldCreateUser: false, 
            emailRedirectTo: 'https://mitarbeiter.bot-papa.online/index.html' 
          }
        });

        if (error) {
          setStatus(error.message || 'Failed to send the login link.', 'err');
          loginBtn.disabled = false;
          return;
        }

        setStatus('✨ A secure login link has been sent to your email!<br>Please check your inbox (and spam folder).', 'ok');

      } catch(e) {
        setStatus('Unexpected error: ' + e.message, 'err');
        loginBtn.disabled = false;
      }
    }

    document.getElementById('email').addEventListener('keydown', e => {
      if (e.key === 'Enter') sendMagicLink();
    });

    sb.auth.getSession().then(async ({ data }) => {
      if (data?.session) {
        const { data: profile } = await sb
          .from('intranet_profiles')
          .select('active')
          .single();
          
        if (profile?.active) {
          window.location.href = '../index.html';
        } else {
          await sb.auth.signOut();
          setStatus('Your account is not yet activated. Please contact Bodo.', 'err');
        }
      }
    });
  </script>
</body>
</html>
